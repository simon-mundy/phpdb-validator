#:schema https://mago.carthage.software/1.43.0/schema.json
extends = "vendor/php-db/phpdb-qa-tools/mago.toml"
php-version = "8.2.0"

[source]
paths = ["src", "test"]
includes = ["vendor"]

# Repository-specific initializers merge with the shared base list.
[analyzer]
class-initializers = [
    "PhpDb\\ResultSet\\AbstractResultSet::initialize",
    "Laminas\\Form\\Element::init",
    "Laminas\\InputFilter\\BaseInputFilter::init",
]
